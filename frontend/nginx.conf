server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API и SSE сценариев — на бэкенд; буферизацию выключаем, чтобы события демо приходили сразу
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 10m;  # скриншоты для Щита
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: /u/artem и другие маршруты отдаёт index.html
    location / {
        try_files $uri /index.html;
    }
}
